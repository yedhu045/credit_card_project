<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafeCard | Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background:
                linear-gradient(rgba(5, 15, 35, 0.82),
                                rgba(5, 15, 35, 0.92)),
                url('https://images.unsplash.com/photo-1557683316-973673baf926')
                center/cover no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 65px;
            height: 65px;
            background: #2563eb;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 30px;
        }

        .brand h2 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .brand h2 span {
            color: #60a5fa;
        }

        .brand p {
            font-size: 13px;
            color: #cbd5e1;
            margin-top: 7px;
        }

        .admin-label {
            text-align: center;
            color: #93c5fd;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .login-container h3 {
            text-align: center;
            font-size: 23px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .form-label {
            font-size: 13px;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 13px;
            border-radius: 9px;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.14);
            color: white;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .security-note {
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
            margin-top: 22px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #93c5fd;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: white;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="brand">

            <div class="brand-icon">🛡️</div>

            <h2>SAFE<span>CARD</span></h2>

            <p>Secure Payments. Smarter Protection.</p>

        </div>

        <div class="admin-label">
            ADMINISTRATOR PORTAL
        </div>

        <h3>Admin Login</h3>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger text-center py-2">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Admin Username
                </label>

                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Enter admin username"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>

            </div>

            <button type="submit" class="login-btn">
                Login to Admin Dashboard →
            </button>

        </form>

        <div class="security-note">
            🔒 Authorized administrators only
        </div>

        <a href="{% url 'home' %}" class="back-link">
            ← Back to SafeCard Home
        </a>

    </div>

</body>
</html>
